    *{box-sizing:border-box}body,button,input,textarea{font-family:"Nunito",sans-serif}body{margin:0;background:linear-gradient(140deg,#e9f6ff,#f7f4ff 65%,#fff7df);color:var(--ink);font-size:18px;line-height:1.5}

  <script src="/_sdk/a202d01287f70bbd.resizing_sdk.js" type="text/javascript" integrity="sha512-1HSymNrRbmVrPINeyKeKDVHS1r/3KBjQvJ/IjvgAGUrP4+gPCV6nzQEbyDs7SEReA7mlPuHyFKB9Zk2K9KmXhQ=="></script>
 </head>
 <body>
  <div class="shell">
   <header class="top canva-header">
    <div class="brand">
     ☁️ MPI Informatika • Kelas 9
    </div>
    <div id="topBadge" class="badge canva-tag">
     Belajar bersama
    </div>
   </header>
   <main id="app" aria-live="polite"></main>
   <footer class="footer canva-footer">
    Dibuat oleh Pak Guru Jawa · Semua contoh file dan link di sini hanya simulasi.
   </footer>
  </div>
  <script>
const KEY='mpi-upload-session';
const initial=()=>({name:'',kelas:'',awal:null,akhir:null,game:null,reflection:null,question:'',sim:0});
let state;try{state={...initial(),...JSON.parse(sessionStorage.getItem(KEY)||'{}')}}catch(e){state=initial()}
let view=state.name&&state.kelas?'home':'welcome', quizIndex=0,selected=null,materialIndex=0,matchFirst=null,matched=[],matchAttempts=0,matchOrder=[],reflectDraft={understand:'',feeling:''};
const app=document.getElementById('app');
const save=()=>sessionStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,fn,kind='btn')=>`<button type="button" class="${kind} canva-button" onclick="${fn}">${text}</button>`;
const back=()=>btn('← Kembali ke Home',"go('home')",'secondary');
function shell(title,tag,body){app.innerHTML=`<div class="section-head"><div><div class="eyebrow">${esc(tag)}</div><h1>${esc(title)}</h1></div>${back()}</div><section class="panel canva-panel">${body}</section>`;document.getElementById('topBadge').textContent=title}
function go(dest){view=dest;selected=null;window.scrollTo({top:0,behavior:'smooth'});render()}
function render(){
 if(view!=='welcome'&&(!state.name||!state.kelas))view='welcome';
 document.getElementById('topBadge').textContent=view==='welcome'?'Belajar bersama':'Halo, '+state.name;
 if(view==='welcome')return welcome();
 if(view==='home')return home();
 if(view==='apersepsi')return apersepsi();
 if(view==='awal'||view==='akhir')return quiz();
 if(view==='materi')return materi();
 if(view==='simulasi')return simulasi();
 if(view==='game')return game();
 if(view==='refleksi')return refleksi();
}
function welcome(){app.innerHTML=`<section class="hero canva-section"><div><div class="eyebrow">Media Pembelajaran Interaktif</div><h1>Upload file &amp; bagikan link 🔗</h1><p class="muted">Belajar cara menyimpan tugas di internet. Lalu, bagikan link agar guru atau teman bisa melihatnya.</p><p><strong>Pembuat: Pak Guru Jawa</strong></p><form id="startForm"><div class="field"><label for="studentName">Nama Siswa</label><input class="canva-input" id="studentName" maxlength="60" autocomplete="name" required placeholder="Tulis namamu"></div><div class="field"><label for="studentClass">Kelas</label><input class="canva-input" id="studentClass" maxlength="30" required placeholder="Contoh: 9A"></div><button class="btn canva-button" type="submit">Mulai Belajar →</button></form></div><div class="art" role="img" aria-label="Ilustrasi laptop, awan, dan link">💻</div></section>`;
 document.getElementById('startForm').onsubmit=e=>{e.preventDefault();let n=document.getElementById('studentName').value.trim(),k=document.getElementById('studentClass').value.trim();if(!n||!k){e.target.reportValidity();return}state.name=n;state.kelas=k;save();go('home')}}
const menus=[['apersepsi','💡','Apersepsi','Mulai dengan pertanyaan.'],['awal','🧭','Asesmen Awal','Cek yang sudah kamu tahu.'],['materi','📚','Materi Pokok','Belajar langkah demi langkah.'],['game','🧩','Matching Game','Cocokkan istilah dan arti.'],['akhir','🏁','Asesmen Akhir','Lihat hasil belajarmu.'],['refleksi','🌱','Refleksi','Ceritakan pengalamanmu.']];
function home(){app.innerHTML=`<section class="hero canva-section" style="min-height:230px;margin-bottom:20px"><div><div class="eyebrow">Beranda belajar · ${esc(state.kelas)}</div><h1>Halo, ${esc(state.name)}! 👋</h1><p>Pilih satu kartu. Kamu boleh belajar sesuai urutan, atau membuka materi kapan saja.</p></div><div class="art" style="min-height:170px" role="img" aria-label="Ilustrasi laptop untuk belajar">💻</div></section><div class="menu">${menus.map(([id,icon,title,desc])=>`<button class="menu-card canva-card" onclick="go('${id}')"><span class="icon">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`).join('')}</div><section class="panel canva-panel" style="margin-top:20px"><h2>Hasil belajarku</h2><div class="summary"><div class="stat canva-card">Asesmen awal<b>${state.awal===null?'Belum':state.awal+'/10'}</b></div><div class="stat canva-card">Matching game<b>${state.game===null?'Belum':state.game+'/8'}</b></div><div class="stat canva-card">Asesmen akhir<b>${state.akhir===null?'Belum':state.akhir+'/10'}</b></div></div><p class="muted">Refleksi: ${state.reflection?'Sudah diisi ✅':'Belum diisi'}</p><div id="resetArea">${btn('Mulai Lagi / Reset Data Sesi','askReset()','danger')}</div></section>`}
function askReset(){document.getElementById('resetArea').innerHTML=`<div class="notice warn">Hapus nama, kelas, skor, dan refleksi pada sesi ini?</div><div class="row">${btn('Ya, hapus','resetAll()','danger')}${btn('Batal',"document.getElementById('resetArea').innerHTML=btn('Mulai Lagi / Reset Data Sesi','askReset()','danger')",'ghost')}</div>`}
function resetAll(){sessionStorage.removeItem(KEY);state=initial();view='welcome';render()}
function apersepsi(){shell('Apersepsi','01 · Ayo berpikir',`<div class="mini-art" role="img" aria-label="Laptop berisi tugas dan ponsel teman">💻📄</div><h2>Tugas Rani ada di laptop.</h2><p>File tugasnya besar. Rani ingin guru dan teman melihatnya. Namun, file itu masih ada di laptop Rani.</p><div class="notice warn"><strong>Menurutmu:</strong><br>Bagaimana teman dan guru bisa melihat file itu?<br>Apa bedanya mengirim file dengan membagikan link?</div>${btn('Saya punya pertanyaan','showQuestion()','btn')}<div id="questionBox">${state.question?`<div class="notice">Pertanyaanmu: ${esc(state.question)}</div>`:''}</div>`)}
function showQuestion(){document.getElementById('questionBox').innerHTML=`<div class="field"><label for="myQuestion">Tulis pertanyaanmu</label><textarea class="canva-input" id="myQuestion" placeholder="Saya ingin tahu...">${esc(state.question)}</textarea></div>${btn('Simpan pertanyaan','saveQuestion()','secondary')}`}
function saveQuestion(){state.question=document.getElementById('myQuestion').value.trim();save();document.getElementById('questionBox').innerHTML=`<div class="notice success">${state.question?'Pertanyaanmu: '+esc(state.question):'Belum ada pertanyaan. Tidak apa-apa!'}</div>`}
const awal=[
 ['File itu apa?',['Tempat menyimpan banyak map','Satu berkas, misalnya foto atau tugas','Tombol untuk internet'],1],
 ['Folder itu apa?',['Tempat mengumpulkan file','Nama sebuah link','Alat untuk mengetik'],0],
 ['Mana contoh nama file?',['Tugas_IPA.pdf','Meja kelas','Buka pintu'],0],
 ['Apa arti upload?',['Menghapus file','Mengirim file dari perangkat ke tempat online','Mencetak file'],1],
 ['Di mana file dapat disimpan secara online?',['Di awan penyimpanan online','Di meja belajar','Di tas sekolah'],0],
 ['Link itu apa?',['Alamat untuk membuka sesuatu di internet','Ukuran file','Jenis folder'],0],
 ['Setelah membuat link, bagaimana mengambilnya?',['Tekan Salin link','Matikan laptop','Hapus file'],0],
 ['Siapa dapat membuka link yang masih terbatas/pribadi?',['Semua orang','Hanya orang yang diberi izin','Siapa pun yang menebak nama file'],1],
 ['Apa yang aman saat berbagi link?',['Membagikan kata sandi juga','Membagikan data pribadi','Memilih orang yang tepat'],2],
 ['Apa beda izin melihat dan mengedit?',['Melihat hanya membaca; mengedit bisa mengubah','Keduanya selalu sama','Melihat berarti menghapus'],0]
];
const akhir=[
 ['Budi mau mengumpulkan tugas lewat link. Apa yang dilakukan dulu?',['Upload file tugas','Hapus file','Matikan internet'],0],
 ['Nama file tugas mana yang paling jelas?',['baru.pdf','Tugas_Informatika_Budi.pdf','aaaa.pdf'],1],
 ['Foto kegiatan kelas akan dibagikan untuk dilihat. Izin apa yang cocok?',['Hanya dapat melihat','Dapat mengedit','Tidak perlu izin'],0],
 ['Guru tidak bisa membuka link tugasmu. Apa yang perlu dicek?',['Warna laptop','Izin akses link','Nama teman'],1],
 ['Setelah upload, apa langkah sebelum menyalin link?',['Atur akses','Hapus folder','Cetak layar'],0],
 ['Teman meminta izin edit, padahal hanya perlu membaca. Apa pilihan aman?',['Beri izin edit','Beri izin lihat saja','Bagikan kata sandi'],1],
 ['Mengapa link perlu diuji sebelum dikirim?',['Agar tahu link bisa dibuka','Agar file membesar','Agar folder hilang'],0],
 ['Kamu salah memilih file berisi data pribadi. Apa yang baik dilakukan?',['Tetap bagikan','Jangan bagikan; pilih file yang benar','Kirim ke semua orang'],1],
 ['Jika memilih “siapa saja yang memiliki link”, siapa bisa melihat?',['Orang yang mendapat link','Hanya pemilik laptop','Tidak ada orang'],0],
 ['Urutan yang tepat adalah ...',['Salin link, hapus file, upload','Upload, atur akses, salin dan bagikan link','Edit, cetak, buang'],1]
];
function quiz(){let end=view==='akhir',key=end?'akhir':'awal',qs=end?akhir:awal,title=end?'Asesmen Akhir':'Asesmen Awal';if(quizIndex>=10){let score=state[key],pct=score*10;return shell(title,end?'05 · Hasil belajar':'02 · Cek awal',`<div class="mini-art">🏆</div><h2>Hebat, ${esc(state.name)}!</h2><div class="summary"><div class="stat">Skor<b>${score}/10</b></div><div class="stat">Jawaban benar<b>${score}</b></div><div class="stat">Persentase<b>${pct}%</b></div></div><div class="notice success"><strong>${score>=8?'Sangat baik!':score>=5?'Terus berlatih!':'Ayo belajar pelan-pelan!'}</strong><br>${end?(score>=8?'Kamu sudah paham. Tetap hati-hati saat berbagi link.':'Buka lagi Materi Pokok, lalu coba kembali.'):'Ini hanya cek awal. Semua materi tetap bisa kamu buka.'}</div><div class="row">${btn('Ulangi kuis',`restartQuiz('${key}')`)}${btn('Buka Materi',"go('materi')",'secondary')}</div>`)}
 let q=qs[quizIndex];shell(title,(end?'05':'02')+' · Soal '+(quizIndex+1)+' dari 10',`<div class="progress canva-progress"><span style="width:${quizIndex*10}%"></span></div><div class="mini-art">${end?'🎯':'🧭'}</div><p class="question">${esc(q[0])}</p><div class="choices">${q[1].map((a,i)=>`<button class="choice canva-button ${selected===i?'selected':''}" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div id="answerFeedback" aria-live="polite"></div><div class="row">${quizIndex>0?btn('← Sebelumnya','prevQuiz()','ghost'):''}${btn(quizIndex===9?'Lihat hasil':'Berikutnya →','nextQuiz()')}</div>`)}
let answers={awal:Array(10).fill(null),akhir:Array(10).fill(null)};
function chooseAnswer(i){selected=i;render()}
function nextQuiz(){if(selected===null){document.getElementById('answerFeedback').innerHTML='<div class="notice warn">Pilih satu jawaban dulu, ya.</div>';return}answers[view][quizIndex]=selected;quizIndex++;selected=answers[view][quizIndex]??null;if(quizIndex===10){let key=view;state[key]=answers[key].reduce((n,a,i)=>n+(a===(key==='awal'?awal:akhir)[i][2]?1:0),0);save()}render()}
function prevQuiz(){quizIndex--;selected=answers[view][quizIndex];render()}
function restartQuiz(key){answers[key]=Array(10).fill(null);quizIndex=0;selected=null;view=key;render()}
const lessons=[
 {icon:'📄📁',title:'File dan folder',points:['File adalah satu berkas. Contoh: foto tugas atau Tugas_IPA.pdf.','Folder seperti map. Isinya bisa beberapa file.','Contoh: folder “Tugas Kelas 9” berisi tugas dari banyak pelajaran.']},
 {icon:'✅📄',title:'Siapkan file',points:['Beri nama yang jelas. Contoh: Tugas_Informatika_Ani.pdf.','Pakai format yang diminta guru, misalnya PDF.','Cek ukuran file. Jika terlalu besar, perkecil dengan bantuan guru.']},
 {icon:'💻⬆️☁️',title:'Upload file atau folder',points:['1. Buka layanan penyimpanan online. Masuk dengan akun milikmu di layanan tersebut.','2. Pilih tombol “Baru” atau “Upload”.','3. Pilih “Upload file” atau “Upload folder”.','4. Pilih berkas yang benar dari perangkat.','5. Tunggu sampai proses selesai. Cek apakah berkas muncul.']},
 {icon:'☁️🔗',title:'Buat link berbagi',points:['1. Temukan file atau folder yang sudah diupload.','2. Pilih menu “Bagikan”.','3. Atur siapa yang boleh membuka.','4. Tekan “Salin link”. Kirim link itu kepada guru atau teman yang tepat.']},
 {icon:'🔒👀',title:'Atur izin akses',points:['Terbatas/pribadi: hanya orang yang kamu beri izin bisa membuka.','“Siapa saja yang memiliki link” + “hanya dapat melihat”: penerima link bisa melihat, tetapi tidak mengubah.','Izin komentar atau edit dipakai hanya jika memang perlu.','Hati-hati: orang dengan izin edit bisa mengubah isi file.']},
 {icon:'🔍🔗',title:'Uji link sebelum dikirim',points:['Buka link yang sudah disalin di tab baru.','Cek: apakah file yang benar terlihat?','Jika orang lain tidak bisa membuka, periksa lagi pengaturan akses.']},
 {icon:'🛡️🤝',title:'Etika dan keamanan',points:['Jangan bagikan kata sandi.','Jangan bagikan data pribadi, foto, atau dokumen sensitif.','Periksa file dan penerima link. Bagikan hanya kepada orang yang tepat.']},
 {icon:'⬆️🔒🔗',title:'Ingat 3 langkah',points:['1. Upload file atau folder.','2. Atur akses yang aman.','3. Salin dan bagikan link.']}
];
function materi(){let l=lessons[materialIndex];shell('Materi Pokok','03 · Langkah '+(materialIndex+1)+' dari 8',`<div class="steps">${lessons.map((_,i)=>`<span class="dot ${i<=materialIndex?'on':''}"></span>`).join('')}</div><div class="mini-art" role="img" aria-label="Ilustrasi ${esc(l.title)}">${l.icon}</div><h2>${l.title}</h2><ul class="bullets">${l.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="row">${materialIndex>0?btn('← Sebelumnya','materialStep(-1)','ghost'):''}${materialIndex<7?btn('Langkah berikutnya →','materialStep(1)'):''}${materialIndex>=3?btn('Coba Simulasi →',"go('simulasi')",'secondary'):''}</div>`)}
function materialStep(n){materialIndex+=n;render()}
const simMessages=['Pilih file contoh di bawah.','Tekan tombol Upload.','Pilih izin: siapa saja yang memiliki link, hanya dapat melihat.','Tekan Salin link.','Uji link yang sudah dibuat.','Selesai! Link contoh dapat dilihat.'];
function simulasi(){let s=state.sim; shell('Coba Simulasi','03 · Latihan tanpa file sungguhan',`<div class="progress canva-progress"><span style="width:${s/5*100}%"></span></div><div class="mini-art">${['📄','📄','☁️','🔒','🔗','✅'][s]}</div><h2>Langkah ${Math.min(s+1,5)} dari 5</h2><p>${simMessages[s]}</p><div class="notice">File contoh: <strong>Tugas_Informatika_NamaSiswa.pdf</strong><br>Ini file fiktif. Tidak ada file pribadimu yang dibuka.</div><div class="row">${s===0?btn('Pilih file contoh','advanceSim()'):s===1?btn('⬆️ Upload','advanceSim()'):s===2?btn('👀 Siapa saja yang memiliki link — hanya dapat melihat','advanceSim()'):s===3?btn('🔗 Salin link','advanceSim()'):s===4?btn('🔍 Uji link','advanceSim()'):btn('Ulangi simulasi','resetSim()','secondary')}</div><div id="simFeedback" class="notice success">${s===0?'Ayo mulai!':s===5?'Bagus! File dapat dilihat tanpa izin edit.':'Bagus! '+simMessages[s]}</div>${s>=4?'<p class="muted">Link contoh: https://contoh.invalid/tugas-informatika (tidak membuka situs sungguhan)</p>':''}`)}
function advanceSim(){state.sim=Math.min(5,state.sim+1);save();render()}
function resetSim(){state.sim=0;save();render()}
const pairs=[['File','Satu berkas, misalnya foto'],['Folder','Tempat mengumpulkan file'],['Upload','Mengirim file ke tempat online'],['Download','Mengambil file dari internet'],['Link','Alamat untuk membuka file'],['Viewer','Hanya dapat melihat'],['Editor','Dapat mengubah isi'],['Privasi','Menjaga data agar tetap aman']];
function setupGame(){matched=[];matchFirst=null;matchAttempts=0;matchOrder=[...pairs.keys()].sort(()=>Math.random()-.5)}
function game(){if(!matchOrder.length)setupGame();shell('Matching Game','04 · Cocokkan 8 pasangan',`<p>Tekan satu istilah, lalu tekan artinya. Coba sampai cocok!</p><div class="summary"><div class="stat">Pasangan benar<b id="pairCount">${matched.length}/8</b></div><div class="stat">Skor terbaik sesi<b>${state.game===null?'Belum':state.game+'/8'}</b></div></div><div class="grid2"><div class="match-col">${pairs.map((p,i)=>`<button class="match-card canva-card ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} onclick="pickMatch('term',${i})">🟦 ${p[0]}</button>`).join('')}</div><div class="match-col">${matchOrder.map(i=>`<button class="match-card canva-card ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} onclick="pickMatch('meaning',${i})">💬 ${pairs[i][1]}</button>`).join('')}</div></div><div id="matchFeedback" class="notice">Cari pasangan yang tepat, ya!</div><div class="row">${btn('Ulangi permainan','restartGame()','secondary')}</div>`)}
function pickMatch(side,i){if(matched.includes(i))return;let card=event.currentTarget;if(!matchFirst){matchFirst={side,i,card};card.classList.add('selected');document.getElementById('matchFeedback').textContent='Sekarang pilih kartu di kolom lain.';return}if(matchFirst.side===side){matchFirst.card.classList.remove('selected');matchFirst={side,i,card};card.classList.add('selected');return}matchAttempts++;let correct=matchFirst.i===i;matchFirst.card.classList.remove('selected');matchFirst=null;if(correct){matched.push(i);state.game=matched.length;save();game();document.getElementById('matchFeedback').textContent=matched.length===8?'Hebat! Semua 8 pasangan cocok. 🎉':'Cocok! Lanjutkan. 🌟'}else{document.getElementById('matchFeedback').textContent='Belum cocok. Coba lagi, ya!'} }
function restartGame(){setupGame();game()}
function refleksi(){let r=state.reflection;shell('Refleksi','06 · Cerita belajarku',`<p>Tidak ada jawaban salah di sini. Ceritakan dengan jujur, ya.</p><form id="reflectionForm"><h2>Seberapa paham kamu?</h2><div class="pillrow">${[['😊','Sudah paham'],['🙂','Mulai paham'],['🤔','Masih belajar']].map(([e,t])=>`<button type="button" class="pill canva-button ${reflectDraft.understand===t?'selected':''}" onclick="selectReflect('understand','${t}')">${e} ${t}</button>`).join('')}</div><h2 style="margin-top:25px">Bagaimana perasaanmu?</h2><div class="pillrow">${[['😄','Senang'],['😌','Tenang'],['😕','Bingung']].map(([e,t])=>`<button type="button" class="pill canva-button ${reflectDraft.feeling===t?'selected':''}" onclick="selectReflect('feeling','${t}')">${e} ${t}</button>`).join('')}</div>${[['known','Hal yang paling saya pahami'],['confused','Hal yang masih membingungkan'],['plan','Rencana saya setelah belajar']].map(([id,label])=>`<div class="field"><label for="${id}">${label}</label><textarea id="${id}" class="canva-input" placeholder="Tulis dengan kata-katamu sendiri...">${esc(r?.[id]||'')}</textarea></div>`).join('')}<div id="reflectFeedback"></div><button class="btn canva-button" type="submit">Kirim Refleksi</button></form>${r?`<div class="notice success"><h3>Ringkasan refleksi ${esc(state.name)}</h3><p><strong>Pemahaman:</strong> ${esc(r.understand)} · <strong>Perasaan:</strong> ${esc(r.feeling)}</p><p><strong>Sudah paham:</strong> ${esc(r.known)}</p><p><strong>Masih membingungkan:</strong> ${esc(r.confused)}</p><p><strong>Rencana:</strong> ${esc(r.plan)}</p><p>Terima kasih sudah bercerita. Terus belajar pelan-pelan! 🌱</p></div>`:''}`);
 document.getElementById('reflectionForm').onsubmit=e=>{e.preventDefault();let known=document.getElementById('known').value.trim(),confused=document.getElementById('confused').value.trim(),plan=document.getElementById('plan').value.trim();if(!reflectDraft.understand||!reflectDraft.feeling||!known||!confused||!plan){document.getElementById('reflectFeedback').innerHTML='<div class="notice warn">Pilih dua pilihan dan isi tiga kotak cerita dulu, ya.</div>';return}state.reflection={...reflectDraft,known,confused,plan};save();render()}}
function selectReflect(field,value){let values={known:document.getElementById('known').value,confused:document.getElementById('confused').value,plan:document.getElementById('plan').value};reflectDraft[field]=value;document.querySelectorAll('#reflectionForm textarea').forEach(el=>el.value=values[el.id]);document.querySelectorAll('.pill').forEach(el=>{if(el.textContent.includes(value))el.classList.add('selected');else if(field==='understand'?/paham|belajar/.test(el.textContent):/Senang|Tenang|Bingung/.test(el.textContent))el.classList.remove('selected')})}
reflectDraft=state.reflection?{understand:state.reflection.understand,feeling:state.reflection.feeling}:{understand:'',feeling:''};
render();
</script>
 </body>
</html>
